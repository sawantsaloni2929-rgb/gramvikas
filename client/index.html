<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#15803d" />
    <meta name="description" content="GramVikas — Offline-First Smart Business Management System for Rural Entrepreneurs in Maharashtra. Works 100% offline with automatic cloud synchronization and smart SMS alerts." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GramVikas" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>GramVikas — ग्रामीण उद्योजक स्मार्ट व्यवसाय प्रणाली</title>
  </head>
  <body class="bg-cream-50 text-slate-800 antialiased selection:bg-forest-100 selection:text-forest-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker registration for PWA offline capability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('GramVikas ServiceWorker registered with scope:', reg.scope);
            })
            .catch(err => {
              console.log('GramVikas ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
